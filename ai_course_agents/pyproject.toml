[project]
name = "ai-course-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "panikhidin.dmitriy@zoloto585.ru" }
]
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=5.0.0",
    "fastembed>=0.9.0",
    "google-adk>=2.9.2",
    "litellm>=1.84",
    "pydantic>=2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "sse-starlette>=3.5.0",
    "tzdata>=2026.5",
]

[project.scripts]
ai-course-agents = "ai_course_agents:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"          # async def test_... запускаются без декоратора
testpaths = ["tests"]

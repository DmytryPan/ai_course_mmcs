[project]
name = "ai-course-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "panikhidin.dmitriy@zoloto585.ru" }
]
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.9.2",
    "ipykernel>=7.4.0",
    "openai>=3.17.0",
    "openai-agents>=0.22",
    "pydantic>=2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
ai-course-agents = "ai_course_agents:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
